name: 🚀 Deploy Laravel App to VPS (Password Auth)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 2. Setup PHP di CI Runner
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan versi PHP Laravel-mu
          extensions: mbstring, xml, ctype, iconv, mysql, pgsql, pdo_pgsql, pdo_mysql, bcmath, filter, json, tokenizer, blake2
          coverage: none

      # 3. Setup Node.js untuk Build Assets (Vite / Tailwind)
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4. Install PHP Dependencies (Production Mode)
      - name: 📦 Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 5. Install & Build Frontend Assets (Vite)
      - name: 🎨 Build Frontend Assets
        run: |
          npm ci
          npm run build

      # 6. Buat File .env dari GitHub Secret
      - name: 📝 Inject Production .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 7. Install sshpass & Sync Files ke VPS via Password
      - name: 🚚 Sync Files to VPS via RSYNC (Password Auth)
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          sshpass -e rsync -avz -e "ssh -p ${{ secrets.VPS_PORT || 22 }} -o StrictHostKeyChecking=no" \
            --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/sessions/*' \
            ./ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/nama-app

      # 8. Eksekusi Command Artisan & Permission di VPS via Password
      - name: ⚙️ Execute Post-Deployment Commands on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ secrets.VPS_PORT || 22 }} -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /var/www/nama-app

            # Fix Permissions Folder Storage & Cache
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Migration & Optimization Cache
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Storage Symlink (jika belum ada)
            php artisan storage:link || true

            # Reload PHP-FPM
            sudo systemctl reload php8.2-fpm || sudo systemctl reload php8.3-fpm
          EOF